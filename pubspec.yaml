name: efbd
description: "Official mobile application for eFootballers Bangladesh - The premier eFootball community and tournament platform in Bangladesh."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  url_launcher: ^6.3.1
  firebase_core: ^3.10.1
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.1
  image_picker: ^1.1.2
  provider: ^6.1.1
  intl: ^0.20.3
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - asset/logo.jpg
    - asset/
